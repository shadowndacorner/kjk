name: release

on:
  push:
    tags: ["v*", "dev-*"]
    branches: [main, develop]
    paths:
      - Cargo.lock
      - rust-toolchain.toml
      - .github/workflows/release.yml
      - .github/workflows/ci.yml
      - .github/release.py
  workflow_dispatch:
    inputs:
      prerelease:
        description: Also draft a pre-release of this branch
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  DRAFT_PRERELEASE: ${{ inputs.prerelease }}

jobs:
  context:
    name: release provenance
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      commit: ${{ steps.context.outputs.commit }}
      publication: ${{ steps.context.outputs.publication }}
      prerelease: ${{ steps.context.outputs.prerelease }}
      tagged: ${{ steps.context.outputs.tagged }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: verify source and classify release
        id: context
        run: python .github/release.py prepare --output release-context.json
      - uses: actions/upload-artifact@v4
        with:
          name: release-context
          path: release-context.json
          if-no-files-found: error

  # This also runs for malformed release tags: every tagged commit is checked.
  checks:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/ci.yml

  package:
    name: package (${{ matrix.platform }})
    needs: context
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: macos-aarch64, runner: macos-15, artifact: macos-arm64, dist: "" }
          - { platform: windows-x86_64, runner: windows-latest, artifact: windows-x86_64, dist: "" }
          - { platform: linux-x86_64, runner: ubuntu-22.04, artifact: linux-x86_64, dist: "" }
    defaults:
      run:
        shell: bash
    env:
      KJK_RELEASE_TAG: ${{ needs.context.outputs.tag }}
      BUILD_COMMIT: ${{ needs.context.outputs.commit }}
      PLATFORM: ${{ matrix.platform }}
      DIST: ${{ matrix.dist }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.commit }}
          fetch-depth: 0
      - name: Toolchain
        run: rustup toolchain install
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev poppler-utils
      - name: DLSS SDK
        if: matrix.dist == '--dlss'
        uses: ./.github/actions/dlss-sdk
      - name: pdftotext
        if: matrix.dist == '--dlss' && runner.os == 'Windows'
        run: command -v pdftotext || choco install -y --no-progress xpdf-utils
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about@0.9.3
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
      - name: remove cached packages
        run: rm -rf target/packages
      - name: package
        shell: pwsh
        run: |
          if ($env:DIST -eq '--dlss') {
            cargo run --locked -q -p xtask -- dist --dlss
          } else {
            cargo run --locked -q -p xtask -- dist
          }
      - name: check the extracted archive
        run: |
          flags=()
          if [ "$DIST" = --dlss ]; then flags+=(--dlss); fi
          python .github/release.py check --packages target/packages \
            --tag "$KJK_RELEASE_TAG" --commit "$BUILD_COMMIT" --platform "$PLATFORM" "${flags[@]}"
      - uses: actions/attest-build-provenance@v2
        if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        with:
          subject-path: |
            target/packages/*.tar.gz
            target/packages/*.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            target/packages/*.tar.gz
            target/packages/*.zip
          if-no-files-found: error

  # Windows and Linux run the full approved suite in checks. The optional Mac
  # package retains its own determinism gate, even when no runner is available.
  sim:
    name: sim determinism (macOS arm64)
    needs: context
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.commit }}
          fetch-depth: 0
      - name: Toolchain
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: sim
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}
      - name: sim determinism
        run: cargo test --release --locked -p approved_tests --test approved sim_determinism
      - name: passed
        run: echo passed > sim-passed.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sim-macos-arm64
          path: sim-passed.txt
          if-no-files-found: error

  release:
    name: publish development or draft stable release
    needs: [context, checks, package, sim]
    if: >-
      always() && !cancelled() && needs.context.result == 'success' &&
      needs.checks.result == 'success' && needs.context.outputs.publication != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.context.outputs.commit }}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: require Windows and Linux and write update metadata
        run: |
          python .github/release.py assemble --context artifacts/release-context/release-context.json \
            --artifacts artifacts --output packages
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.context.outputs.tag }}
          BUILD_COMMIT: ${{ needs.context.outputs.commit }}
          PUBLICATION: ${{ needs.context.outputs.publication }}
          PRERELEASE: ${{ needs.context.outputs.prerelease }}
          TAGGED: ${{ needs.context.outputs.tagged }}
        run: |
          python .github/release.py verify --context artifacts/release-context/release-context.json
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists; published assets are never replaced. Delete an unwanted draft yourself before rerunning."
            exit 1
          fi
          flags=()
          if [ "$TAGGED" = true ]; then
            flags+=(--verify-tag)
          else
            flags+=(--target "$BUILD_COMMIT")
          fi
          if [ "$PUBLICATION" = draft ]; then flags+=(--draft); fi
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" packages/* --repo "$GITHUB_REPOSITORY" \
            "${flags[@]}" --title "kjk $TAG" --notes-file packages.md
