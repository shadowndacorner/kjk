name: ci

# Release tags call this same gate from release.yml. Other tags and every
# pull request, including drafts and documentation changes, run it here.
on:
  push:
    branches: [main, develop]
    tags: ["**", "!v*", "!dev-*"]
  pull_request:
    types: [opened, synchronize, reopened, closed]
  # pin.yml starts it on its `pin` branch, whose pull request starts none.
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A merged pull request's closing run has main as its ref: keyed on the
# event and the pull request's branch, it cancels that pull request's runs
# and not the push to main beside it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  # Each job builds once: the release profile's incremental cache
  # (Cargo.toml) would only slow it and fill the rust cache.
  CARGO_INCREMENTAL: 0
  # The sim must reach the same state on every platform (Decision 3): the
  # approved test sim_determinism requires the hash pinned in
  # bumps/SIM_HASH. Branches never edit it: a bump file says the sim moves,
  # and the pin before a release writes it (bumps/README.md, pin.yml).

jobs:
  # The approved tests and clippy are jobs of their own, side by side:
  # each ~5 minutes, where one after the other took ~10 before a pull
  # request could merge. Their rust caches are their own (the job is in
  # the key).
  tests:
    name: tests (${{ matrix.os }})
    if: github.event.action != 'closed'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The order the pending bump files reached main numbers them.
          fetch-depth: 0

      # rust-toolchain.toml pins the version; this installs it.
      - name: Toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}

      - name: publish-check
        if: runner.os == 'Linux'
        run: cargo xtask publish-check

      # Every dependency's licence on deny.toml's list, from crates.io only.
      - name: licences
        if: runner.os == 'Linux'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check licenses bans sources

      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --all -- --check

      # The sound device probes build the audio crate, whose sound output
      # links ALSA on Linux.
      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev

      # Determinism, collision probes, movement measures, the network, the
      # sound device's stream; no Bevy.
      - name: approved tests
        run: cargo test --release --locked -p approved_tests

  clippy:
    name: clippy (ubuntu-latest)
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The order the pending bump files reached main numbers them.
          fetch-depth: 0

      - name: Toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}

      # Bevy's window crates want these to type-check; the sound device
      # (cpal) wants ALSA's.
      - name: Linux packages
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev

      # `--all-features` takes in `dlss`, whose bindings are made from
      # NVIDIA's SDK headers (a checkout of about 60 MB, cached).
      - name: DLSS SDK
        uses: ./.github/actions/dlss-sdk

      # The save editor's window (`save_editor`, eframe) is linted in
      # editor.yml alone, so the engine's runs never build it.
      - name: clippy
        run: cargo clippy --locked --workspace --exclude save_editor --all-targets --all-features -- -D warnings

      # The game without the verbs that check and measure and the layers'
      # probes (the `probes` feature, on by default).
      - name: clippy (no probes)
        run: cargo clippy --locked -p launcher --all-targets --no-default-features -- -D warnings

  # Link and start the player's feature set on both release platforms.
  build:
    name: build kjk (${{ matrix.os }})
    if: github.event.action != 'closed'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          # The order the pending bump files reached main numbers them.
          fetch-depth: 0

      - name: Toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: build-player
          save-if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}

      - name: Linux packages
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev

      - name: build
        run: cargo build --locked -p launcher --no-default-features

      - name: kjk startup
        run: |
          ./target/debug/kjk --help
          ./target/debug/kjk --version

      - name: delivery tools startup
        run: |
          python -B .github/release.py --help
          python -B tools/kjk-update.py --help

      - name: default features and Steam
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && runner.os == 'Linux'
        run: |
          cargo build --locked -p launcher
          ./target/debug/kjk --help

  # kjk as `cargo xtask dist --dlss` builds it, with DLSS (the `dlss`
  # feature, NVIDIA's static library linked in), beside `build` so it adds
  # no time to it; it starts and prints its help, which needs no NVIDIA
  # card. Pull requests have the `dlss` code type-checked by clippy
  # (`--all-features`); the link, on main alone, as `build`'s.
  dlss:
    name: build kjk with DLSS (ubuntu-latest)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The order the pending bump files reached main numbers them.
          fetch-depth: 0

      - name: Toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          key: dlss
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Linux packages
        run: sudo apt-get update && sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libasound2-dev libudev-dev

      - name: DLSS SDK
        uses: ./.github/actions/dlss-sdk

      - name: build
        run: cargo build --locked -p launcher --no-default-features --features dlss

      - name: kjk --help
        run: ./target/debug/kjk --help
