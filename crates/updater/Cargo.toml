[package]
name = "updater"
version = "0.0.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "kjk-update"
path = "src/main.rs"

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2 = "1"
glob = "0.3"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
tempfile = "3"
# Use the OS trust store instead of redistributing a certificate bundle under
# a licence outside about.toml. Rustls still verifies all TLS certificates.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rustls-native-certs = "0.8"
url = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
