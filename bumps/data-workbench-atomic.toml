# The sim's hash moves on purpose: the upgrade bench keeps a refused change
# out of the items, the allocator and the step's output, and it treats a
# fitted part's identity more carefully.
sim = "the upgrade bench stages item, allocator and output changes and restores them together when a change is refused; a colour swap keeps a crystal of any level, describes a part fitted in an earlier module by every description still in play (they must agree on the part's kind, and the highest level any of them asks is the one checked), and refuses when one of them is no upgrade at all or they name different kinds of part"
